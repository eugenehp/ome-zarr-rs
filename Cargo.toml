[package]
name = "ome-zarr"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Implementation of images in Zarr files (OME-Zarr / OME-NGFF). A Rust port of ome-zarr-py."
license = "BSD-2-Clause"
repository = "https://github.com/eugenehp/ome-zarr-rs"
homepage = "https://github.com/eugenehp/ome-zarr-rs"
documentation = "https://docs.rs/ome-zarr"
readme = "README.md"
keywords = ["ome-zarr", "ngff", "zarr", "microscopy", "imaging"]
categories = ["science", "encoding", "command-line-utilities"]
# the parity fixtures (tests/fixtures, ~57 MB) and their generators stay in the repository
exclude = ["/tests", "/ci", "/scripts", "/.claude", ".DS_Store"]

[lib]
name = "ome_zarr"
path = "src/lib.rs"

[[bin]]
name = "ome_zarr"
path = "src/main.rs"
required-features = ["render"]

[features]
default = ["http", "cloud", "render"]
# GPU rendering and the native viewer (threers, winit), the CLI's `view` and
# `render`, and the sample images (`data`, decoded with threers' PNG reader).
# Off, the crate is metadata, I/O, pyramids and transforms only: what a wasm
# app embedding it as a reader needs.
render = ["dep:threers", "dep:winit"]
# Read OME-Zarr (and zipped OME-Zarr) over http(s) (native only; on wasm,
# supply a store of your own or `Store::zip_bytes`)
http = ["dep:zarrs_http", "dep:reqwest"]
# Read/write OME-Zarr in cloud object storage via object_store (native only):
# s3://bucket/path, gs://bucket/path, az://container/path
cloud = ["dep:zarrs_object_store", "dep:object_store", "dep:tokio"]
s3 = ["cloud"]

[dependencies]
bytes = "1"
# the `lazy` module's fetch loop (any executor: the browser's, or a test's)
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
csv = "1.3"
half = { version = "2.4", features = ["bytemuck"] }
inventory = "0.3.21"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
lzma-rs = "0.3"
log = "0.4"
ndarray = "0.17"
num-complex = { version = "0.4", features = ["bytemuck"] }
percent-encoding = "2.3"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
url = "2.5"
zarrs = { version = "0.23", default-features = false, features = ["gzip", "zlib", "bz2", "zstd", "blosc", "crc32c", "sharding", "transpose", "ndarray"] }
zarrs_storage = "0.4"
zarrs_codec = "0.2.1"
zarrs_metadata = "0.7.2"
zarrs_plugin = "0.4.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# deflated members of a zip read in ranges (`remote_zip`); already zip's
flate2 = "1"
# Primary renderer: GPU slices, channel composites and label overlays (WebGPU on wasm)
# The crates.io release, pinned: the API used here (volume slices, headless
# targets, the PNG codec) is all in it, so no threers checkout is needed.
threers = { version = "=0.0.8", default-features = false, optional = true }

# Native only: filesystem stores, threads, http, the CLI and the windowed viewer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1.10"
winit = { version = "0.29", optional = true }
zarrs = { version = "0.23", default-features = false, features = ["filesystem"] }
zarrs_http = { version = "0.3.1", optional = true }
zarrs_object_store = { version = "0.7", optional = true }
object_store = { version = "0.14", optional = true, features = ["aws", "gcp", "azure"] }
reqwest = { version = "0.12", optional = true, features = ["blocking"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await", "executor"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
wasm-bindgen = "=0.2.129"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

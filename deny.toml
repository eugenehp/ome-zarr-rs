# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unmaintained, not vulnerable; a compile-time macro of rustls-rustcrypto
    # (`tls-rustcrypto` only: the default `tls-graviola` has none of it)
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive through rustls-rustcrypto" },
    # unmaintained, not vulnerable; winit 0.30 → sctk-adwaita → ab_glyph (Linux window decorations)
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: transitive through winit" },
]

[licenses]
version = 2
# Permissive licenses only. r-efi's `LGPL-2.1-or-later` is one of three
# alternatives (MIT OR Apache-2.0 OR LGPL), so it is not needed here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
